<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Flashcard Quiz App — Create, flip, and master flashcards with smooth animations and persistent storage. Built as a PWA for offline use.">
    <meta name="theme-color" content="#0f0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FlashMind — Flashcard Quiz App</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    
    <div id="app" class="app-container">

        <!-- ───── Header ───── -->
        <header class="app-header">
            <div class="logo-group">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect x="2" y="4" width="18" height="14" rx="3" stroke="url(#g1)" stroke-width="2"/>
                        <rect x="8" y="10" width="18" height="14" rx="3" stroke="url(#g2)" stroke-width="2" fill="rgba(255,255,255,0.05)"/>
                        <defs>
                            <linearGradient id="g1" x1="2" y1="4" x2="20" y2="18"><stop stop-color="#7f5af0"/><stop offset="1" stop-color="#2cb67d"/></linearGradient>
                            <linearGradient id="g2" x1="8" y1="10" x2="26" y2="24"><stop stop-color="#e53170"/><stop offset="1" stop-color="#7f5af0"/></linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="logo-text">Flash<span>Mind</span></h1>
            </div>
            <nav class="header-actions">
                <button id="btn-manage" class="btn-icon" title="Manage Cards" aria-label="Manage flashcards">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                </button>
                <button id="btn-add" class="btn-primary-sm" title="Add Card" aria-label="Add new flashcard">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span>New Card</span>
                </button>
            </nav>
        </header>

        
        <div class="stats-bar" id="stats-bar">
            <div class="stat-chip">
                <span class="stat-label">Total</span>
                <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">Current</span>
                <span class="stat-value" id="stat-current">0</span>
            </div>
            <div class="progress-ring-wrapper">
                <svg class="progress-ring" width="40" height="40">
                    <circle class="progress-ring-bg" cx="20" cy="20" r="16"/>
                    <circle class="progress-ring-fill" id="progress-ring" cx="20" cy="20" r="16"/>
                </svg>
                <span class="progress-text" id="progress-text">0%</span>
            </div>
        </div>

        
        <div id="empty-state" class="empty-state">
            <div class="empty-icon">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                    <rect x="8" y="12" width="36" height="28" rx="6" stroke="url(#eg1)" stroke-width="2.5" stroke-dasharray="4 3"/>
                    <rect x="20" y="24" width="36" height="28" rx="6" stroke="url(#eg2)" stroke-width="2.5"/>
                    <line x1="38" y1="34" x2="38" y2="46" stroke="#7f5af0" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="32" y1="40" x2="44" y2="40" stroke="#7f5af0" stroke-width="2.5" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="eg1" x1="8" y1="12" x2="44" y2="40"><stop stop-color="#7f5af0" stop-opacity="0.4"/><stop offset="1" stop-color="#2cb67d" stop-opacity="0.4"/></linearGradient>
                        <linearGradient id="eg2" x1="20" y1="24" x2="56" y2="52"><stop stop-color="#7f5af0"/><stop offset="1" stop-color="#e53170"/></linearGradient>
                    </defs>
                </svg>
            </div>
            <h2>No flashcards yet</h2>
            <p>Create your first flashcard to start learning!</p>
            <button id="btn-add-empty" class="btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Create First Card
            </button>
        </div>

        
        <main id="card-viewer" class="card-viewer hidden">
            <div class="card-stage">
                <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Click to flip card">
                    <div class="flashcard-inner" id="flashcard-inner">
                        <div class="flashcard-face flashcard-front">
                            <span class="face-label">QUESTION</span>
                            <p id="card-question" class="card-text"></p>
                            <span class="flip-hint">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                                Tap to reveal
                            </span>
                        </div>
                        <div class="flashcard-face flashcard-back">
                            <span class="face-label">ANSWER</span>
                            <p id="card-answer" class="card-text"></p>
                            <span class="flip-hint">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                                Tap to flip back
                            </span>
                        </div>
                    </div>
                </div>
            </div>

           
            <div class="card-nav">
                <button id="btn-prev" class="btn-nav" aria-label="Previous card">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="card-counter">
                    <span id="current-index">1</span>
                    <span class="separator">/</span>
                    <span id="total-cards">1</span>
                </div>
                <button id="btn-next" class="btn-nav" aria-label="Next card">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>

           
            <div class="card-actions">
                <button id="btn-edit-card" class="btn-action" title="Edit this card">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    Edit
                </button>
                <button id="btn-delete-card" class="btn-action btn-action-danger" title="Delete this card">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Delete
                </button>
            </div>
        </main>

        
        <div id="manage-panel" class="manage-panel hidden">
            <div class="panel-header">
                <h2>Manage Cards</h2>
                <button id="btn-close-manage" class="btn-icon" aria-label="Close panel">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="panel-body" id="card-list">
               
            </div>
        </div>
        <div id="manage-overlay" class="overlay hidden"></div>

        
        <div id="modal-overlay" class="overlay hidden"></div>
        <div id="card-modal" class="modal hidden" role="dialog" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">New Flashcard</h2>
                <button id="btn-close-modal" class="btn-icon" aria-label="Close modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="card-form" class="modal-body" autocomplete="off">
                <div class="form-group">
                    <label for="input-question">Question</label>
                    <textarea id="input-question" rows="3" placeholder="Enter your question…" required></textarea>
                </div>
                <div class="form-group">
                    <label for="input-answer">Answer</label>
                    <textarea id="input-answer" rows="3" placeholder="Enter the answer…" required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" id="btn-cancel-modal" class="btn-secondary">Cancel</button>
                    <button type="submit" id="btn-save-card" class="btn-primary">Save Card</button>
                </div>
            </form>
        </div>

       
        <div id="delete-overlay" class="overlay hidden"></div>
        <div id="delete-confirm" class="modal modal-sm hidden" role="alertdialog">
            <div class="modal-header">
                <h2>Delete Card?</h2>
            </div>
            <div class="modal-body">
                <p class="confirm-text">This action cannot be undone. The flashcard will be permanently removed.</p>
                <div class="modal-actions">
                    <button id="btn-cancel-delete" class="btn-secondary">Cancel</button>
                    <button id="btn-confirm-delete" class="btn-danger">Delete</button>
                </div>
            </div>
        </div>

       
        <div id="toast" class="toast hidden" role="alert" aria-live="polite"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
